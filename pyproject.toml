[project]
name = "ossie-clickhouse"
version = "0.0.1"
description = "Apache Ossie semantic model implementation for ClickHouse"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # Not on PyPI yet; pinned to the Ossie main revision the code was written against.
    "apache-ossie @ git+https://github.com/apache/ossie.git@adfa9e4#subdirectory=python",
    "PyYAML>=6.0",
]

[project.scripts]
ossie-clickhouse = "ossie_clickhouse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_clickhouse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
